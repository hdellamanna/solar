<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOLAR — Brand mark on warm off-white background.
  Used for apple-touch-icon (which iOS applies no transparency to) and for
  contexts that need an opaque fill (store listings, etc).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Solar">
  <defs>
    <linearGradient id="solarGradientFilled" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFC93C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#FAFAF7"/>
  <g transform="translate(256 256)">
    <g>
      <g transform="rotate(0)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(30)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(60)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(90)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(120)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(150)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(180)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(210)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(240)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(270)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(300)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
      <g transform="rotate(330)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradientFilled)"/></g>
    </g>
    <circle cx="0" cy="0" r="96" fill="url(#solarGradientFilled)"/>
  </g>
  <rect x="237" y="170" width="38" height="172" rx="19" ry="19" fill="#0F172A"/>
  <circle cx="256" cy="170" r="10" fill="#0F172A"/>
</svg>
