<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOLAR — Brand mark
  Concept: Option A — Geometric sun (12 rounded rays) framing a single
  tall vertical growth bar with a small tick at the top, suggesting both
  "solar" (the rays) and "money growth" (the bar).

  - 512×512 viewBox, maskable-friendly (safe zone = central 80% circle)
  - Gradient: solar orange #FF8A3D → solar yellow #FFC93C (135deg)
  - Stroke rounded, no sharp edges (Apple-Card-clean)
  - Tested at 16, 32, 180, 192, 256, 384, 512, 1024 px — silhouette holds

  Color tokens (do not deviate):
    Primary  #FF8A3D
    Secondary #FFC93C
    Light bg  #FAFAF7
    Dark bg   #0B0F1A
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Solar">
  <title>Solar</title>
  <defs>
    <linearGradient id="solarGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFC93C"/>
    </linearGradient>
  </defs>

  <!-- 12 rounded rays + central disc, all in a single gradient group -->
  <g transform="translate(256 256)">
    <g>
      <g transform="rotate(0)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(30)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(60)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(90)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(120)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(150)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(180)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(210)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(240)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(270)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(300)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
      <g transform="rotate(330)"><rect x="-16" y="-210" width="32" height="72" rx="16" ry="16" fill="url(#solarGradient)"/></g>
    </g>
    <circle cx="0" cy="0" r="96" fill="url(#solarGradient)"/>
  </g>

  <!--
    Ascending growth bar with a tick at the top.
    Soft slate (#0F172A) for strong contrast against the warm gradient.
  -->
  <g>
    <rect x="237" y="170" width="38" height="172" rx="19" ry="19" fill="#0F172A"/>
    <circle cx="256" cy="170" r="10" fill="#0F172A"/>
  </g>
</svg>
