; Solar Money — PHP-FPM overrides
;
; Solar-specific pool config, applied on top of the stock
; /usr/local/etc/php-fpm.d/www.conf. Named zz-solar.conf so it loads LAST
; and wins over the stock defaults.
;
; Tuned for Render's free tier (512MB RAM, shared CPU).

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Surface PHP errors to stderr so Render can capture them.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no

; Per-request limits.
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 60