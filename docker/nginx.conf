# Solar Money — nginx config for the production Docker image
#
# - Listens on port 10000 (Render's public port).
# - Serves /public/* directly (Vite build output).
# - Forwards everything else to PHP-FPM on 9000 (the loopback socket inside
#   the container, managed by supervisord).

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Send logs to stdout/stderr so Render can capture them.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    # Hide the nginx version in error pages / response headers.
    server_tokens off;

    # Render sets X-Forwarded-* headers; PHP-FPM needs to forward them
    # so Laravel's Request::ip() / Request::secure() work.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Gzip for text responses (HTML/CSS/JS/JSON/SVG).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 10000 default_server;
        server_name _;
        root /app/public;
        index index.php;

        # Browsers cache static assets aggressively (Vite emits fingerprinted
        # filenames, so safe to long-cache).
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Service worker must never be cached aggressively (else users
        # never see updates). Render serves /sw.js with no-cache headers.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
            try_files $uri =404;
        }

        # Manifest must never be cached (PWA install copy).
        location = /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # Health check (used by Render's load balancer).
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Front controller — Laravel handles the rest.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 60s;
            include fastcgi_params;
        }

        # Block dotfiles (defense-in-depth, on top of Laravel's own middleware).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}