version: 1
plan:
  name: 'Solar Auth Phase 2 — Password Reset (PR2 of FASE 4D)'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 4
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0

tasks:
  # ───────────────────────────────────────────────────────────────────────
  # Track 1: Backend — full PHP layer (no test file ownership; tests own theirs)
  # ───────────────────────────────────────────────────────────────────────
  - id: backend-impl
    title: 'Backend: purpose migration, PasswordResetService, 2 controllers, mail, routes, email view'
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      Re-derive correctness — do NOT just re-read the producer's diff.

      Setup:
        cd /tmp/solar-auth-p2-backend
        ls -la vendor | head -3               # must be a real dir, not symlink
        grep "APP_BASE_PATH" .env             # should be set
        /opt/homebrew/opt/php@8.4/bin/php artisan migrate --env=testing --force
        /opt/homebrew/opt/php@8.4/bin/php artisan test --filter='AuthTest|EmailVerificationTest'
        /opt/homebrew/opt/php@8.4/bin/php artisan test

      Mandatory checks:
        1. Real migration runs cleanly (no "column already exists" error, no
           CHECK constraint violation from old test data).
        2. AuthTest + EmailVerificationTest still pass — the regression from
           PR1 must be intact after the `purpose` column was added.
        3. `routes:list | grep password` shows exactly 4 routes with the
           correct names: password.request, password.email, password.reset,
           password.update — all under the `guest` middleware group.
        4. `PasswordResetService::resetPassword('bogus', 'newpass')` throws
           `InvalidResetTokenException` (or a domain exception with a clear
           message) — not a generic 500.
        5. Inspect the new `password-reset.blade.php` — must be plain HTML +
           inline CSS only. No `<script>` tags, no `@vite`, no external
           stylesheet links. Subject line in PasswordResetMail.php must be
           ASCII-only (no accented chars like "Redefinição").
        6. The 4 new routes do NOT appear under `auth` middleware — the user
           should be able to hit /reset-password/{token} while logged out.
        7. Open `deliverable.md` — confirm it lists all 12 scope items, has
           commit hashes, and notes any test file changes.
        8. Confirm the branch was actually pushed:
           `git ls-remote origin feature/auth-p2-backend` must return a SHA.
        9. Confirm NO Vue file was modified by this track:
           `git diff main --name-only | grep -E '\.vue$' | wc -l` must be 0.
       10. Confirm NO test file was added by this track:
           `git diff main --name-only | grep -E 'PasswordResetTest\.php' | wc -l` must be 0.
       11. Run the AUTH flow manually with curl: POST /forgot-password with a
           known user (demo@solar.app) — must redirect back with the standard
           success flash, must send exactly one email (assert via
           `Mail::fake()` in a one-off tinker call if needed).
       12. `database/factories/EmailVerificationTokenFactory.php` has a
           `->passwordReset()` state OR equivalent way to set purpose for
           tests.

      Output: PASS / FAIL with line-numbered specifics.
    timeout_ms: 1500000   # 25 min hard cap
    prompt: |
      You are implementing the BACKEND half of Solar Money's password reset flow
      (PR2 of FASE 4D). The full design is in `docs/auth/phase-2/design.md` — READ
      IT FIRST, top to bottom. Do not skim.

      ## Worktree setup (CRITICAL — read carefully)

      Use a dedicated worktree. The vendor/ dir in this repo is a symlink to
      /tmp/solar/vendor, which makes Laravel's test framework infer the wrong
      basePath. Fix it BEFORE running phpunit:

        cd /tmp/solar
        git worktree add /tmp/solar-auth-p2-backend feature/auth-p2-backend
        cd /tmp/solar-auth-p2-backend
        rm -rf vendor                              # remove the symlink
        cp -R /tmp/solar/vendor vendor             # copy real vendor dir
        /opt/homebrew/bin/composer dump-autoload   # regenerate autoloader
        echo "APP_BASE_PATH=$(pwd)" >> .env        # belt-and-suspenders

      Do NOT `composer install` in the worktree — it will time out. The cp -R
      trick is fast (~5s) and identical to main's vendor.

      All your work happens in /tmp/solar-auth-p2-backend. Push the branch when
      done. Do NOT touch /tmp/solar directly.

      ## Forbidden debugging paths (LESSON LEARNED — DO NOT DO THESE)

      - DO NOT `grep` anything under vendor/ or read Laravel framework source.
        The framework works; misusing it is your bug, not the framework's.
      - DO NOT delete the worktree while the branch is checked out.
      - DO NOT poll, sleep, or wait for CI. You are a producer — push and exit.
      - DO NOT touch Vue files (frontend track owns them).
      - DO NOT touch tests/Feature/Auth/PasswordResetTest.php (test track owns it).
      - DO NOT touch any other test file unless a tiny tweak is required to keep
        existing tests passing after the migration (e.g. factory fillable).
        Document any such change in deliverable.md.

      ## Scope (backend only)

        1. `database/migrations/2026_06_12_150000_add_purpose_to_email_verification_tokens.php`
           — exact schema per design doc lines 38-49. Add `purpose` column with
           default `'email_verification'`, add 3-col index, drop 2-col index, add
           CHECK constraint for `'email_verification' | 'password_reset'`.
        2. `app/Models/EmailVerificationToken.php` — add `PURPOSE_EMAIL_VERIFICATION`
           and `PURPOSE_PASSWORD_RESET` constants, add `purpose` to `$fillable`,
           add `scopeForPurpose(string $purpose)`, update `generateForUser()` to
           accept a `string $purpose` arg defaulting to PURPOSE_EMAIL_VERIFICATION.
        3. `app/Models/User.php` — if it has its own `createPasswordResetToken`
           helper or `password` cast, leave as-is. Document in deliverable.md
           if you change anything.
        4. `app/Services/Auth/PasswordResetService.php` (+ `InvalidResetTokenException`)
           — methods: `requestReset(string $email, ?string $ip=null, ?string $ua=null): bool`
           (always true, no user-enumeration oracle; generates token + sends mail
           only if user exists), `resetPassword(string $rawToken, string $newPassword): User`
           (throws on bad/expired/used; on success: marks token consumed, hashes
           new password, invalidates remember-me cookies, returns user), and
           `canRequestReset(string $email): bool` (1-per-30s, max 5-per-hour).
           Throttle cache key prefix: `password-reset:throttle:`.
        5. `app/Http/Controllers/Auth/PasswordResetLinkController.php` — `create()`
           (renders ForgottenPassword view) + `store(PasswordResetLinkRequest)`
           (always redirects back with success flash "Se o email existir,
           enviaremos um link em alguns minutos." — never an error).
        6. `app/Http/Controllers/Auth/NewPasswordController.php` — `create(Request, string $token)`
           (if invalid → redirect to forgot-password with error flash; else show
           form) + `store(NewPasswordRequest)` (call service, Auth::login($user)
           after success, redirect to dashboard with success flash).
        7. `app/Http/Requests/Auth/PasswordResetLinkRequest.php` — `authorize(): false`,
           only `email` (required, email, max 160).
        8. `app/Http/Requests/Auth/NewPasswordRequest.php` — `authorize(): false`,
           `token` (required, string) + `password` (required, confirmed, Password::min(8)).
        9. `app/Mail/PasswordResetMail.php` — Mailable. Envelope subject
           "Redefinir senha - Solar Money" (ASCII only, no accent). Content
           view = `emails.password-reset`. Receives `user` + `resetUrl`
           (signed URL with 60-min TTL).
       10. `resources/views/emails/password-reset.blade.php` — Plain HTML
           matching `verify-email.blade.php` style: orange→yellow→violet
           gradient logo "Solar Money", h1 "Redefina sua senha", CTA button
           "Redefinir senha" linking to $resetUrl, fallback plain-URL line,
           security footnote. Inline CSS only. No JS, no external CSS, no
           backdrop-filter.
       11. `resources/views/emails/password-reset-text.blade.php` — Plain text
           fallback (lines 1-3: greeting + link; line 4: footer).
       12. `routes/web.php` — add 4 routes inside the EXISTING `guest`
           middleware group (do not create a new group):
             - GET  /forgot-password        → PasswordResetLinkController@create     name=password.request
             - POST /forgot-password        → PasswordResetLinkController@store     name=password.email
             - GET  /reset-password/{token} → NewPasswordController@create         name=password.reset
             - POST /reset-password         → NewPasswordController@store          name=password.update

      ## Quality bar

      - Mirrors the PR1 patterns: read app/Services/Auth/EmailVerificationService.php
        and app/Http/Controllers/Auth/VerifyEmailController.php for shape, but
        do NOT extend them — PasswordResetService is intentionally separate.
      - Use signed URLs: `URL::temporarySignedRoute('password.reset', now()->addMinutes(60), ['token' => $rawToken])`.
      - Never log raw tokens. Never echo raw tokens in error messages.
      - SHA-256 hash before storing: `hash('sha256', $rawToken)`.
      - Invalidate ALL active password_reset tokens for the user when a new
        one is issued AND when one is consumed (consumed = single-use, plus
        zero out any siblings to prevent reuse race).
      - Update `database/factories/EmailVerificationTokenFactory.php` to accept
        a `purpose` state method (e.g. `->passwordReset()`) so the test track
        can build tokens cleanly.

      ## Commit + push

      Commit messages in English. Set git config locally:
        git config user.name "Henrique Della Manna"
        git config user.email "henrique.dellamanna@gmail.com"

      Stage, commit (one commit per logical concern: migration, model, service,
      controllers, mail, routes — or one squash commit if cleaner), then:
        git push -u origin feature/auth-p2-backend

      ## When done

      Write `deliverable.md` in the worktree root with: files created/modified,
      commit hashes, test result summary (you do not own PasswordResetTest but
      should have run the full suite to confirm no regression — 226 tests
      should still pass), branch URL, anything notable.

      Run `php artisan test` ONCE before pushing. If anything is red other
      than PasswordResetTest (which doesn't exist yet), fix it. If
      PasswordResetTest exists from a prior failed run, ignore.

      Push the branch BEFORE you run out of time. A pushed branch is a saved
      branch. A worktree-only change is lost work.

      HANDS OFF the Vue/frontend files. HANDS OFF tests/Feature/Auth/PasswordResetTest.php.

  # ───────────────────────────────────────────────────────────────────────
  # Track 2: Frontend — Vue views, Login link update, email template
  # ───────────────────────────────────────────────────────────────────────
  - id: frontend-impl
    title: 'Frontend: ForgottenPassword + NewPassword Vue pages, Login "Esqueci" link, password-reset email template'
    assigned_to: coder
    verified_by: verifier
    depends_on: [backend-impl]
    timeout_ms: 1500000
    prompt: |
      You are implementing the FRONTEND half of Solar Money's password reset
      flow (PR2 of FASE 4D). The full design is in `docs/auth/phase-2/design.md`
      — READ IT FIRST, top to bottom.

      ## Worktree setup

      Use a dedicated worktree:
        cd /tmp/solar
        git worktree add /tmp/solar-auth-p2-frontend feature/auth-p2-frontend
        cd /tmp/solar-auth-p2-frontend
        rm -rf vendor
        cp -R /tmp/solar/vendor vendor
        /opt/homebrew/bin/composer dump-autoload
        echo "APP_BASE_PATH=$(pwd)" >> .env

      All your work happens here. Push the branch when done.

      ## Vendor worktree issue (same as backend track)

      vendor/ is a symlink to /tmp/solar/vendor by default. The cp -R + APP_BASE_PATH
      trick above fixes it. Do NOT `composer install` in the worktree.

      ## Forbidden paths

      - DO NOT grep vendor/ or read framework source.
      - DO NOT touch backend PHP files (controllers, services, migration, model,
        mail, routes). The backend track owns them.
      - DO NOT touch any test file.
      - DO NOT use `router.X()` from @inertiajs/vue3 — Inertia 3.x tree-shaking
        breaks the named import and crashes the page. Use `useForm()` for ALL
        form submissions (PR1 lesson).
      - DO NOT delete the worktree or the branch.

      ## Scope (frontend only)

        1. `resources/js/Pages/Auth/ForgottenPassword.vue` — Renders inside
           GuestLayout. Heading "Esqueci minha senha", subtitle "Informe seu
           email e enviaremos um link para redefinir.", email input
           (`.input-glass`), submit button "Enviar link de redefinição" that
           POSTs to `route('password.email')` via `useForm`, success flash
           display from `$page.props.flash`, back link to login.
        2. `resources/js/Pages/Auth/NewPassword.vue` — Renders inside GuestLayout.
           Heading "Criar nova senha", hidden `token` input bound from
           `$page.props.token` (URL param) OR read via usePage's url params,
           two password inputs (`.input-glass`) with `Password::min(8)`
           client-side hint, submit button "Redefinir senha" that POSTs to
           `route('password.update')` via `useForm`, error flash display,
           "Solicitar novo link" link back to forgot-password for invalid-token
           case.
        3. `resources/js/Pages/Auth/Login.vue` — Replace the existing "Esqueci"
           link placeholder (it currently has `href="#"` per the Verify PR) with
           `:href="route('password.request')"`. Keep all other Login.vue
           behavior identical.
        4. `resources/views/emails/password-reset.blade.php` — Plain HTML
           email matching the design doc structure. Solar Money gradient logo,
           h1 "Redefina sua senha", greeting "Olá {{ $user->name }}, clique
           no botão abaixo para redefinir sua senha. O link expira em 60
           minutos.", CTA button "Redefinir senha" linking to {{ $resetUrl }},
           fallback URL line, security footnote. Inline CSS only — no
           `<script>`, no external CSS, no backdrop-filter (email clients
           strip it).
        5. `resources/views/emails/password-reset-text.blade.php` — Plain
           text fallback.

      Note: items 4 and 5 may also be touched by the backend track (for the
      password-reset mail class). If the backend track wrote these files
      first, your changes should be a NO-OP or a tiny visual tweak. If you
      rewrite them, ensure the Mailable's `Content` view name still matches.

      ## Quality bar

      - Use existing CSS tokens (`.input-glass`, `.btn-primary`, `.glass`,
        etc.) — don't invent new colors or font sizes. Read
        `resources/css/app.css` and `tailwind.config.js` first.
      - Match the visual language of `resources/js/Pages/Auth/VerifyEmailNotice.vue`
        and `resources/js/Pages/Auth/Login.vue` (same card style, same spacing).
      - Vue 3 `<script setup>` + Composition API (existing project style).
      - pt-BR for ALL user-facing strings. Code comments + commit messages
        in English.
      - No console.log in production Vue.
      - Use useForm, never router.post. PR1 crashed on this exact thing.

      ## Build + commit + push

      Run `npm run build` — must succeed. Then:
        git config user.name "Henrique Della Manna"
        git config user.email "henrique.dellamanna@gmail.com"
        git add -A
        git commit -m "feat(auth): add password reset Vue pages and email template"
        git push -u origin feature/auth-p2-frontend

      Take 2 screenshots using the existing playwright setup (see PR1 deliverable
      for the pattern — look in /tmp/solar-auth-p1-frontend/screen-*.png for
      reference size/style):
        - /tmp/solar-auth-p2-frontend/screen-forgot-password.png
        - /tmp/solar-auth-p2-frontend/screen-new-password.png

      Write `deliverable.md` in the worktree root with: files created/modified,
      screenshot paths, commit hashes, branch URL, any deviations.

      Push the branch BEFORE you run out of time.

    verify_prompt: |
      Re-derive correctness — do NOT just re-read the producer's diff.

      Setup:
        cd /tmp/solar-auth-p2-frontend
        ls -la vendor | head -3
        grep "APP_BASE_PATH" .env
        npm install
        npm run build

      Mandatory checks:
        1. Open `screen-forgot-password.png` and `screen-new-password.png`
           — must show real, glass-styled forms (not blank, not error pages).
        2. `npm run build` exits 0. Inspect the built HTML/JS — no
           `console.log` from production sources. No `router.X()` direct
           calls in built output (only useForm).
        3. ForgottenPassword.vue uses `route('password.email')` and `useForm`.
           NewPassword.vue reads token from `usePage().props.token` (or URL
           param) and POSTs to `route('password.update')` via `useForm`.
        4. Login.vue's "Esqueci" link is now `:href="route('password.request')"`
           — confirm with `git diff main -- resources/js/Pages/Auth/Login.vue`.
        5. `password-reset.blade.php` has no `<script>`, no external CSS
           links, no `@vite` — inline CSS only. Has the orange→yellow→violet
           gradient logo and the "Redefinir senha" CTA button.
        6. NO backend PHP file was modified by this track:
           `git diff main --name-only | grep -E '\.php$' | grep -v 'resources/views/emails' | wc -l` must be 0.
        7. NO test file was added by this track.
        8. All four scoped Vue files are present and modified:
           ForgottenPassword.vue, NewPassword.vue, Login.vue, emails/password-reset.blade.php (+ text fallback).
        9. The Vue pages use existing CSS tokens (`.input-glass`, `.btn-primary`).
           Grep the new files for hardcoded color hex values — should be
           very few (only the gradient logo is allowed inline).
       10. Branch pushed: `git ls-remote origin feature/auth-p2-frontend`.

      Output: PASS / FAIL with specifics.

  # ───────────────────────────────────────────────────────────────────────
  # Track 3: Tests — 13 PasswordResetTest cases + regression on verify flow
  # ───────────────────────────────────────────────────────────────────────
  - id: test-coverage
    title: 'Test coverage: 13 PasswordResetTest cases + regression check on email verification'
    assigned_to: coder
    verified_by: verifier
    depends_on: [backend-impl]
    timeout_ms: 1500000
    prompt: |
      You are writing the test suite for Solar Money's password reset (PR2 of
      FASE 4D). The full design and test list is in
      `docs/auth/phase-2/design.md` — READ IT FIRST, top to bottom.

      ## Worktree setup

      Use a dedicated worktree:
        cd /tmp/solar
        git worktree add /tmp/solar-auth-p2-tests feature/auth-p2-tests
        cd /tmp/solar-auth-p2-tests
        rm -rf vendor
        cp -R /tmp/solar/vendor vendor
        /opt/homebrew/bin/composer dump-autoload
        echo "APP_BASE_PATH=$(pwd)" >> .env
        /opt/homebrew/opt/php@8.4/bin/php artisan migrate --env=testing --force
        /opt/homebrew/opt/php@8.4/bin/php artisan test --filter='AuthTest|EmailVerificationTest'  # baseline must be green

      If baseline isn't green, STOP and report — that means the backend track
      regressed something.

      All your work happens here. Push the branch when done.

      ## Forbidden paths

      - DO NOT modify backend code, controllers, services, migration, model,
        or routes — your track owns ONLY `tests/Feature/Auth/PasswordResetTest.php`.
      - DO NOT modify EmailVerificationTest or AuthTest. The regression check
        is your own test (#12 below), not by editing existing files.
      - DO NOT use `sleep()` for time travel. Use `Carbon::setTestNow()` or
        `travel()`.
      - DO NOT modify the existing EmailVerificationTokenFactory beyond
        adding a `->passwordReset()` state method IF the backend track
        already added it (idempotent — check first).
      - DO NOT use `dd()`, `dump()`, or `var_dump()` in tests.
      - DO NOT log raw tokens, passwords, or emails.

      ## Scope (tests only — 13 cases in `tests/Feature/Auth/PasswordResetTest.php`)

      Use Laravel's testing helpers: `$this->post()`, `Mail::fake()`,
      `Event::fake()`, `Hash::make()`, `Carbon::setTestNow()` / `travel()`,
      `Cache::flush()` in setUp for throttling tests.

      Required test names (MUST match exactly per the design doc):

        1. test_user_can_request_password_reset_link
           — POST /forgot-password with valid email → 302 → success flash,
             email queued (Mail::fake assertQueued PasswordResetMail), token
             row created with purpose='password_reset'
        2. test_password_reset_request_does_not_reveal_user_existence
           — POST with unknown email → 302 with SAME flash as case 1, NO
             email sent, NO token row
        3. test_password_reset_request_throttles_to_one_per_30s
           — second POST within 30s → 302 success but no new token, no email
        4. test_password_reset_request_caps_at_5_per_hour
           — 6th POST in 1h → 302 success but no new token
        5. test_password_reset_link_marks_token_consumed_on_use
           — POST /reset-password with valid token → token row has
             consumed_at, password changed
        6. test_password_reset_link_expires_after_60_minutes
           — travel(61 minutes) → POST with valid token → 422 / redirect with error
        7. test_password_reset_link_cannot_be_reused
           — POST same token twice → second fails
        8. test_password_reset_invalidates_other_active_tokens
           — request 2 resets, use the 1st → 2nd is invalid
        9. test_password_reset_does_not_block_unverified_users
           — unverified user (email_verified_at=null) can still reset
       10. test_password_reset_loglocks_user_in_after_success
           — assertAuthenticatedAs after successful reset
       11. test_password_reset_email_contains_signed_url
           — Mail::fake, assert email has $resetUrl, assert URL has
             `?expires=` and `&signature=` (signed URL signature)
       12. test_old_email_verification_tokens_still_work
           — REGRESSION: existing PR1 verify flow (request verify link →
             click → verified) still works after the purpose column was added
       13. test_invalid_token_redirects_to_forgot_password_with_error
           — GET /reset-password/bad-token → 302 to forgot-password with
             error flash

      ## Quality bar

      - Each test INDEPENDENT — create own user via factory or firstOrCreate.
        Cache::flush() in setUp() to reset throttle state.
      - Use `Hash::make('newpassword')` for password changes, not raw strings.
      - The "regression" test (#12) creates a verify token via the existing
        `EmailVerificationService::send()` and asserts the verify flow works
        end-to-end after the migration ran. Do NOT add new columns or seed
        data.
      - Use `$this->assertDatabaseHas` / `assertDatabaseMissing` for row checks.
      - Use `assertAuthenticatedAs($user)` for login assertions.
      - For the rate-limit cases (3 and 4), use `Cache::flush()` between
        steps ONLY if needed — the service's own cache keys should be the
        only thing that matters.
      - The factory must be set up so `EmailVerificationToken::factory()->forUser($u)->passwordReset()->create()`
        produces a token row with purpose='password_reset'. If the backend
        track didn't add the state method, add it yourself (small factory
        modification is in-scope for this track).

      ## Run + commit + push

      Run these in order:
        /opt/homebrew/opt/php@8.4/bin/php artisan test --filter=PasswordResetTest --list-tests
        # Confirm all 13 tests are listed with exact names
        /opt/homebrew/opt/php@8.4/bin/php artisan test --filter=PasswordResetTest
        # All 13 must pass
        /opt/homebrew/opt/php@8.4/bin/php artisan test
        # All 226 + 13 = 239 tests must pass (no regressions)

      If anything fails, fix the test (NOT the production code — that's the
      backend track's job; if you find a real bug, document it in deliverable.md
      and flag it as a blocking issue).

      Then:
        git config user.name "Henrique Della Manna"
        git config user.email "henrique.dellamanna@gmail.com"
        git add -A
        git commit -m "test(auth): add 13 password reset feature tests + regression on verify"
        git push -u origin feature/auth-p2-tests

      Write `deliverable.md` in the worktree root with: test count, branch
      URL, final php artisan test summary line, any flagged bugs.

      Push the branch BEFORE you run out of time.

    verify_prompt: |
      Re-derive correctness — do NOT just re-read the producer's diff.

      Setup:
        cd /tmp/solar-auth-p2-tests
        ls -la vendor | head -3
        grep "APP_BASE_PATH" .env
        /opt/homebrew/opt/php@8.4/bin/php artisan test --filter=PasswordResetTest --list-tests

      Mandatory checks:
        1. All 13 test names from the design doc exist with EXACT names.
           Use --list-tests to confirm; do not trust grep alone.
        2. Each test is INDEPENDENT — none share state. Skim for `static`
           properties or shared `$this->user`.
        3. Time-based tests (case 6, 60min expiry) use Carbon::setTestNow()
           or travel() — grep for `sleep(` should return 0 results.
        4. Case 4 (5-per-hour cap): sends 6 requests, asserts the 6th is
           rate-limited. Read the assertion carefully.
        5. Case 2 (no user enumeration): asserts BOTH known and unknown
           email cases produce the SAME HTTP status (302) and SAME flash
           message. Read carefully — the flash string must be byte-equal.
        6. Case 11 (signed URL): opens the captured email, finds the
           $resetUrl, and asserts it has Laravel's `?expires=` and
           `&signature=` query params.
        7. Case 12 (regression): the test exercises the FULL existing
           email-verification flow end-to-end after the migration. It
           must NOT just call the service directly — it must POST the
           email-resend endpoint and click the link.
        8. NO test uses dd()/dump()/var_dump(). NO test logs sensitive
           data (raw tokens, passwords, full emails).
        9. NO test imports classes it doesn't use (scan for unused use
           statements).
       10. `php artisan test --filter=PasswordResetTest` → 13 pass, 0 fail.
       11. `php artisan test` → at least 239 pass, 0 fail, 0 error.
       12. NO production PHP file was modified by this track except the
           factory IF and ONLY IF the backend track didn't add the
           ->passwordReset() state method:
           `git diff main --name-only | grep -E '^app/' | grep -v 'EmailVerificationTokenFactory.php' | wc -l` must be 0.
       13. Branch pushed: `git ls-remote origin feature/auth-p2-tests`.

      Output: PASS / FAIL with test numbers and specifics.
