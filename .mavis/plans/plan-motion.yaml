       13. `app_meta.build_version` row exists with value `0.11.0`.
       14. NO Vue file was modified: `git diff main --name-only | grep -E
           '\.vue$' | wc -l` must be 0 (frontend track owns Vue).
       15. The new tests bring the total to 261+6+3+4 = 274. Run
