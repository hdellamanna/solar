    audit_sample_rate: 0
    strict_mode: false
tasks:
  - id: motion-backend
    title: 'Backend: migration + UserMotionPreference service + 6 dedicated tests'
    prompt: |
      You are implementing the BACKEND half of FASE 4D-Polish UX Motion for
      Solar Money v0.11.0. The full design is in
      `docs/fase-4d-polish-motion/design.md` — READ IT FIRST top to bottom.
      If the doc does not exist yet, stop and ask the plan owner.

      ## Worktree setup (CRITICAL — read carefully)

      Use a dedicated worktree. The vendor/ dir in this repo is a symlink to
      /tmp/solar/vendor. Fix it BEFORE running anything:

        cd /tmp/solar
        git worktree add /tmp/solar-motion-backend feature/motion-backend
        cd /tmp/solar-motion-backend
        rm -rf vendor
        cp -R /tmp/solar/vendor vendor
        /opt/homebrew/bin/composer dump-autoload
        echo "APP_BASE_PATH=$(pwd)" >> .env

      Do NOT `composer install` in the worktree — it will time out.
      The cp -R trick is fast (~5s) and identical to main's vendor.

      All your work happens in /tmp/solar-motion-backend. Push the branch
      when done. Do NOT touch /tmp/solar directly.

      ## Forbidden debugging paths (LESSONS LEARNED)

      - DO NOT grep anything under vendor/ or read Laravel framework source.
      - DO NOT delete the worktree while the branch is checked out.
      - DO NOT touch Vue files (frontend track owns them).
      - DO NOT touch test files in tests/Feature/Auth/ (frontend-and-tests
        track owns the new motion tests).
      - DO NOT use `Illuminate\Support\Facades\Str` (Laravel 13 removed
        the facade — use `Illuminate\Support\Str` for the static helper).
      - DO NOT poll, sleep, or wait for CI. Push and exit.

      ## Scope (backend only)

      1. `database/migrations/2026_06_14_010000_add_motion_preferences_to_users.php`
         (new) — adds 4 columns to `users`:
           - `motion_preference` enum('auto','reduced','full') DEFAULT 'auto'
           - `motion_backdrop` boolean DEFAULT 1  (mesh canvas, glass sweep)
           - `motion_spring` boolean DEFAULT 1    (transitions, sheets, micro)
           - `motion_parallax` boolean DEFAULT 1  (sun parallax dashboard)
         Reversible. Default all-1 so existing users keep current behavior.
         Update `app/Models/User.php` to add the 4 fields to `$fillable` and
         to cast `motion_backdrop/spring/parallax` to `bool`.

      2. `app/Services/UserMotionPreference.php` (new) — singleton service:
           - `__construct(public ?User $user)`
           - `string $resolvedMotion` = 'auto' | 'reduced' | 'full'
             (computed: if user->motion_preference != 'auto', use that;
              else read `prefers-reduced-motion` from request)
           - `bool shouldAnimate(string $category): bool`
             where category ∈ {'backdrop', 'spring', 'parallax'}.
             Returns true if (resolvedMotion == 'full') OR
             (resolvedMotion == 'auto' AND not OS-reduced AND user->motion_<cat>).
             Returns false if (resolvedMotion == 'reduced') OR
             (resolvedMotion == 'auto' AND OS-reduced).
           - `array toInertiaProps(): array` — returns 4 booleans + string
             for Inertia shared props.
         Register as singleton in `app/Providers/AppServiceProvider::register()`.

      3. `app/Http/Controllers/Settings/AppearanceController.php` (new):
           - `__invoke()` returns `Inertia::render('Settings/Appearance')`
           - `update(Request $r, UserMotionPreference $prefs)` validates
             and persists. Validation:
               motion_preference ∈ {auto, reduced, full} (required)
               motion_backdrop/spring/parallax: boolean (required)
             All-or-nothing update in a single transaction.
             Returns redirect with success flash.

      4. `routes/web.php` — add (inside auth middleware group):
           Route::get('/settings/appearance', [AppearanceController::class, 'show'])
             ->name('settings.appearance.show');
           Route::patch('/settings/appearance', [AppearanceController::class, 'update'])
             ->name('settings.appearance.update');
         (use `show` for `__invoke`'s display action)

      5. `app/Http/Middleware/HandleInertiaRequests.php` — inject the 4
         motion fields into shared Inertia props via the
         UserMotionPreference service. Every page now has access to
         `motion.preference`, `motion.backdrop`, `motion.spring`, `motion.parallax`.

      6. `tests/Feature/Auth/MotionSettingsTest.php` (new) — 6 cases:
           - test_user_can_view_their_appearance_settings
           - test_user_can_update_motion_preference_to_reduced
           - test_user_can_update_motion_preference_to_full
           - test_user_can_granularly_disable_backdrop
           - test_validation_rejects_unknown_motion_value
           - test_motion_settings_round_trip_persists_all_4_fields

      7. `app/Models/UserFactory.php` — add `withReducedMotion()` state
         that sets the 4 fields to the reduced-everything combo.

      8. `README.md` — add a 1-paragraph note in the "Current status"
         section: "Users can now tune motion effects (Settings > Appearance)
         with a system-aware default and per-category overrides."

      9. `app/Http/Controllers/AboutController.php` (new) — single
         `__invoke()` returning `Inertia::render('About')` with no data.
         The page is fully static.

      10. `app/Http/Controllers/TutorialController.php` (new):
          - `__invoke()` returns `Inertia::render('Tutorial', ['chapters' => ...])`
            with a static chapters list (6 chapters, see design doc §3)
          - `chapter(string $slug)` returns the same render with
            `activeChapter` set, validates slug is in the 6 known values.

      11. `routes/web.php` — 3 new PUBLIC routes (no auth, no `web`
          middleware other than the default):
          - `Route::get('/about', [AboutController::class])->name('about')`
          - `Route::get('/tutorial', [TutorialController::class])->name('tutorial')`
          - `Route::get('/tutorial/{chapter}', [TutorialController::class])->name('tutorial.chapter')`
            with `->where('chapter', '[a-z-]+')` to avoid catching
            unrelated slugs.

      12. `app/Models/AppMeta.php` (new) — simple key-value store for
          build metadata:
          - migration: `create_app_meta` table (key string PK, value text)
          - model with `get(string $key, mixed $default): mixed` and
            `set(string $key, mixed $value): void`
          - seed: `app_meta` row `{key: 'build_version', value: '0.11.0'}`
            via the existing `DatabaseSeeder` or a new `AppMetaSeeder`.
          - Used by the footer to render `v0.11.0` and by the AI agent
            slot to know its build context.

      13. `tests/Feature/Public/AboutPageTest.php` (new) — 3 cases:
          - test_about_page_renders_for_guests
          - test_about_page_contains_founder_name
          - test_about_page_contains_microsoft_money_nostalgia_paragraph

      14. `tests/Feature/Public/TutorialPageTest.php` (new) — 4 cases:
          - test_tutorial_index_lists_all_six_chapters
          - test_tutorial_chapter_route_renders_for_known_slug
          - test_tutorial_chapter_route_404s_for_unknown_slug
          - test_tutorial_chapter_contains_an_interactive_demo_block

      ## Quality bar

      - Public surface of `User` model gained 4 new fillable fields —
        all 261 pre-existing tests must still pass without modification.
      - The `UserMotionPreference` service is read-only with respect to
        persistence — the controller owns the write path.
      - Never log raw preferences (low risk, but keep the principle).
      - Enum values are lowercase strings in the DB.
      - Migration is reversible via `down()`.
      - Use `Crypt` / `Hash` only if motion data is sensitive — it isn't.

      ## Commit + push

      Commit messages in English. Set git config locally:
        git config user.name "Henrique Della Manna"
        git config user.email "henrique.dellamanna@gmail.com"

      Stage, commit (one commit per logical concern — migration+model,
      service+singleton, controller+routes, README — or one squash commit
      if cleaner), then:
        git push -u origin feature/motion-backend

      ## When done

      Write `deliverable.md` in the worktree root with: files
      created/modified, commit hashes, test result summary
      (run `php artisan test` — must be 261+6=267 green).
      Branch URL, anything notable.

      Push the branch BEFORE you run out of time.
    verify_prompt: |
      Re-derive correctness — do NOT just re-read the producer's diff.

      Setup:
        cd /tmp/solar-motion-backend
        grep "APP_BASE_PATH" .env
        /opt/homebrew/opt/php@8.4/bin/php artisan migrate --env=testing --force
        /opt/homebrew/opt/php@8.4/bin/php artisan test

      Mandatory checks:
        1. `php artisan test` → 267/267 green, 0 failures. The 261
           pre-existing tests must pass without modification.
        2. Migration adds 4 columns to `users` with the right defaults.
           Run `php artisan migrate:status` and `php artisan db:show users`.
           The migration is reversible: `php artisan migrate:rollback --step=1`
           drops the columns without data loss in the other user columns.
        3. `UserMotionPreference::shouldAnimate('backdrop')`:
           - new user, pref=auto, OS=full → true
           - new user, pref=auto, OS=reduced → false
           - user with pref=reduced → false regardless of category
           - user with pref=full → true regardless of category
           - user with pref=auto, OS=full, motion_backdrop=0 → false
           - user with pref=auto, OS=reduced, motion_backdrop=1 → false (OS wins)
        4. Routes registered: `php artisan route:list | grep appearance`
           shows GET /settings/appearance and PATCH /settings/appearance,
