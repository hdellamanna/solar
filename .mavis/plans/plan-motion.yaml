      Output: PASS / FAIL with line-numbered specifics.
    assigned_to: coder
    role: produce
    verified_by: verifier
    depends_on: []
    max_retries: 2
    timeout_ms: 1500000
  - id: motion-frontend
    title: 'Frontend: motion composable + CSS plumbing + new effects + Appearance settings UI + 10 dedicated tests'
    prompt: |
      You are implementing the FRONTEND half of FASE 4D-Polish UX Motion
      for Solar Money v0.11.0. The full design is in
      `docs/fase-4d-polish-motion/design.md` — READ IT FIRST top to bottom.
      If the doc does not exist yet, stop and ask the plan owner.

      ## Worktree setup

      Use a dedicated worktree that branches off `feature/motion-backend`
      (the backend track's branch), so you have the full backend in place:

        cd /tmp/solar
        git fetch origin feature/motion-backend
        git worktree add /tmp/solar-motion-frontend feature/motion-frontend
        cd /tmp/solar-motion-frontend
        git merge origin/feature/motion-backend --no-edit

        rm -rf vendor
        cp -R /tmp/solar/vendor vendor
        /opt/homebrew/bin/composer dump-autoload
        echo "APP_BASE_PATH=$(pwd)" >> .env

      All your work happens here. Push the branch when done.

      ## Forbidden paths

      - DO NOT grep vendor/ or read framework source.
      - DO NOT touch backend PHP files (services, controllers, middleware,
        routes, providers, mail, config, migrations) — the backend track
        owns them.
      - DO NOT delete the worktree or the branch.
      - DO NOT use `router.X()` from @inertiajs/vue3 — use `useForm()`.

      ## Scope (frontend + tests)

      ### Frontend (Vue / CSS files)

      1. `resources/js/composables/useMotionPreference.ts` (new) — wraps
         `usePage().props.motion` with a reactive API:
           - `useMotionPreference()` returns { preference, backdrop, spring,
             parallax, isReduced, isFull, toggle(category) (client-side
             optimistic, then router.patch to persist) }
           - Listens to `matchMedia('(prefers-reduced-motion: reduce)')`
             change events and re-broadcasts the resolved state via a
             `window.dispatchEvent(new CustomEvent('solar:motion-change'))`.
           - When the OS changes its preference, the `<html data-motion>`
             attribute updates within 200ms.

      2. `resources/css/app.css` — add data-attribute CSS variants:
           ```css
           html[data-motion="reduced"] *,
           html[data-motion="reduced"] *::before,
           html[data-motion="reduced"] *::after {
             animation-duration: 0.001ms !important;
             animation-iteration-count: 1 !important;
             transition-duration: 0.001ms !important;
             scroll-behavior: auto !important;
           }
           html[data-motion-backdrop="0"] .mesh-canvas,
           html[data-motion-backdrop="0"] .glass-sweep {
             display: none !important;
           }
           html[data-motion-parallax="0"] .sun-parallax {
             transform: none !important;
           }
           ```
         Add a transition on the `<html data-motion>` attribute itself
         (200ms ease) so toggling is smooth. Use CSS feature-detection
         so prefers-reduced-motion is respected even without JS.

      3. `resources/js/app.ts` (or wherever the app mounts) — set the
         initial `data-motion`, `data-motion-backdrop`, `data-motion-spring`,
         `data-motion-parallax` attributes on `<html>` from the Inertia
         shared props. Register a listener for the `solar:motion-change`
         event to re-sync attributes on OS-preference change.

      4. `resources/js/Pages/Settings/Appearance.vue` (new) — settings page:
           - Hero card with 3 radio cards for `preference`: "Sistema" /
             "Reduzido" / "Completo". "Sistema" shows a small subtitle
             "Seguindo a preferência do seu sistema operacional".
           - "Personalizar" expandable section with 3 toggles:
             - "Plano de fundo animado" (mesh canvas + glass sweep)
             - "Micro-interações" (page transitions, sheet spring, hold-to-confirm)
             - "Parallax" (sun parallax do dashboard)
           - Live preview card showing a 200px demo of: animated mesh strip,
             a spring button hover, a parallax number counter. All toggle
             with the user's flags in real time.
           - Submit button uses `useForm` and shows success toast on save.
           - pt-BR copy. Code comments in English.

      5. `resources/js/Components/Settings/NavItem.vue` (or extend existing
         settings nav) — add a link to `/settings/appearance` with the
         icon "sparkles" or similar.

      6. Apply 2 NEW liquid-glass effects to existing pages (gated by the
         preference flags so they respect the toggle):
           - **Dashboard balance cards**: number counting animation
             (count from 0 to final value over 800ms with ease-out,
             `Intl.NumberFormat` for currency). When `motion.spring=0`,
             numbers appear instantly.
           - **Transactions list**: row-spring expand animation when
             clicking a transaction to see details (height 0 → auto,
             opacity 0 → 1, 280ms ease-out). When `motion.spring=0`,
             no animation.
         The current effects (mesh canvas, glass sweep, sun parallax,
         hold-to-confirm) are already gated by the new CSS — no change
         needed to those, just verify they still respect the toggle.

      7. `resources/js/Layouts/AuthLayout.vue` (or wherever 2FA challenge
         sits) — confirm the ConfirmHoldButton's progress ring animation
         uses `motion.spring`. Add a CSS class hook.

      8. `resources/js/Components/AppFooter.vue` (new) — copyright
         footer that renders on every layout. Reads
         `app_meta.build_version` from Inertia shared props. Layout:
           - Left: `© 2026 HDMA Ltda. Todos os direitos reservados.`
           - Center: 3 inline links → `/about`, `/tutorial`, `/privacy`
             (privacy link points to `/about` until a real privacy page
             ships — TODO comment in code)
           - Right: `v0.11.0` + `pt-BR` (locale placeholder for FASE 7)
         The footer slides up with spring on first scroll (one-shot per
         session via sessionStorage), respects `motion.spring`.

      9. `resources/js/Layouts/*.vue` (3 files: AuthenticatedLayout,
         GuestLayout, SettingsLayout) — mount `<AppFooter />` once at
         the bottom. The footer is always visible (not sticky).

      10. `resources/js/Pages/About.vue` (new) — see design doc §2. Five
          sections (The why, The what, The how, The roadmap, The
          founder). pt-BR copy in the page. Static content, no data
          fetch. Renders inside `<PublicLayout>` (no auth, no sidebar).

      11. `resources/js/Layouts/PublicLayout.vue` (new) — minimal layout:
          no auth check, top bar with logo + 2 nav links (Sobre /
          Tutorial) + login button, body slot, AppFooter at bottom.

      12. `resources/js/Pages/Tutorial.vue` (new) — see design doc §3.
          Index page listing the 6 chapters as glass cards. Click
          navigates to `/tutorial/:chapter`. Each card has a tiny
          inline SVG illustration (no asset files).

      13. `resources/js/Pages/TutorialChapters/*.vue` (6 new files,
          one per chapter): ContasCategorias, Transacoes,
          MetasOrcamentos, PixTransferencias, InvestimentosDividas,
          Seguranca. Each: prose intro (3-4 paragraphs), interactive
          demo component import, "Ver no Solar" deep-link button.

      14. `resources/js/Components/Tutorial/*.vue` (6 demo components,
          one per chapter). Live Vue mini-apps with mock data — no
          backend calls. Each demo <200 lines, uses Liquid Crystal
          classes. Document each demo's "what you can poke" in code
          comments.

      15. `resources/js/Components/AiAgentSlot.vue` (new) — FASE 8
          chrome placeholder:
          - Floating bubble in bottom-right
          - Spring-bounce on mount (respects `motion.spring`)
          - Click → opens a glass panel anchored to the bubble
          - Cmd+K (Mac) / Ctrl+K (other) opens from anywhere
          - Input with placeholder "Pergunte qualquer coisa sobre suas finanças..."
          - Empty state: 3 example prompts as clickable chips
          - Loading state: animated dots + "Pensando..." copy
          - Submit handler: logs to console + shows "Disponível em
            breve" toast (FASE 8 will wire to real Groq)
          - Voice button: shows browser webkitSpeechRecognition
            placeholder (just calls getUserMedia for permission)
          - Hidden if `config('features.ai_agent')` is false
          - Proper aria-label, role=dialog, aria-modal

      16. `resources/js/composables/useAiAgent.ts` (new) — state machine:
          `{ isOpen, open, close, toggle, focusInput }`. Listens for
          Cmd+K / Ctrl+K at document level, escape closes, focuses
          input on open, returns focus on close. Cleanup keydown
          listener in onUnmounted.

      17. `resources/css/app.css` — add `.ai-agent-slot` styles
          (floating bubble, glass panel, input + button row, chip list
          for example prompts, loading dots animation).

      18. `resources/js/app.ts` — mount `<AiAgentSlot />` at the root
          of the Vue app, after Inertia setup. Pass
          `features.ai_agent` as a prop.

      19. `resources/js/Pages/Settings/Index.vue` — add link to
          `/settings/appearance` AND add new "Inteligência artificial"
          section with placeholder toggle "Assistente IA em todas as
          páginas (em breve — FASE 8)" disabled with badge.

      ### Tests (20 new cases in 6 files)

      Use Laravel's testing helpers + the standard test client. For CSS
      attribute assertions, hit the page and inspect the rendered HTML.

      File 1: `tests/Feature/Auth/MotionRenderingTest.php` (4 cases)
        - test_root_html_has_data_motion_attribute_set
        - test_root_html_reflects_reduced_preference
        - test_root_html_has_granular_backdrop_flag_attribute
        - test_root_html_has_granular_parallax_flag_attribute

      File 2: `tests/Feature/Auth/MotionSettingsPageTest.php` (4 cases)
        - test_authenticated_user_can_view_appearance_settings_page
        - test_authenticated_user_can_save_reduced_motion_preference
        - test_authenticated_user_can_toggle_backdrop_independently
        - test_unauthenticated_user_is_redirected_from_appearance_page

      File 3: `tests/Feature/Auth/ReducedMotionCascadeTest.php` (2 cases)
        - test_reduced_motion_disables_backdrop_via_data_attribute
        - test_reduced_motion_disables_parallax_via_data_attribute
          (these pin the contract that the data-attribute approach works
          end-to-end without needing a full browser test)

      File 4: `tests/Feature/Public/AppFooterTest.php` (3 cases)
        - test_footer_renders_copyright_string_on_every_layout
        - test_footer_links_to_about_and_tutorial
        - test_footer_renders_build_version_from_app_meta

      File 5: `tests/Feature/Public/AiAgentSlotTest.php` (3 cases)
        - test_ai_agent_slot_not_rendered_when_feature_flag_is_off
        - test_ai_agent_slot_renders_when_feature_flag_is_on
        - test_ai_agent_slot_includes_keyboard_shortcut_hint

      File 6: `tests/Feature/Public/TutorialDemosTest.php` (4 cases)
        - test_tutorial_index_lists_all_six_chapters
        - test_each_chapter_page_contains_an_interactive_demo
        - test_tutorial_show_me_button_links_to_real_app_page
        - test_tutorial_demos_use_liquid_crystal_classes (class-name
          presence check, not visual — pins the contract that demos
          stay on-brand)

      ## Quality bar

      - Vue 3 `<script setup>` + Composition API.
      - pt-BR for ALL user-facing strings. Code comments + commit messages
        in English.
      - No console.log in production Vue.
      - Use `useForm`, never `router.post`.
      - The `useMotionPreference()` composable is reactive — toggling a
        flag in one component updates the html attribute for the entire app.
      - All 4 motion attributes (data-motion + 3 granular) are set in
        the initial HTML render — not just after JS hydration.
      - The new effects (counting numbers, row-spring) MUST work in
        Inertia 3.x without `router.X()`.
      - The OS-preference listener uses `matchMedia(...).addEventListener`
        with cleanup in `onUnmounted` to avoid leaks.

