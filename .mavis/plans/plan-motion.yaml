        /opt/homebrew/opt/php@8.4/bin/php artisan test
        # 277 passing (267 pre-existing + 10 new), 0 fail
        npm run build

      Then:
        git config user.name "Henrique Della Manna"
        git config user.email "henrique.dellamanna@gmail.com"
        git add -A
        git commit -m "polish(motion): appearance settings + 3-flags plumbing + 10 dedicated tests (v0.11.0)"
        git push -u origin feature/motion-frontend

      Take 2 screenshots:
        - /tmp/solar-motion-frontend/screen-appearance-default.png
        - /tmp/solar-motion-frontend/screen-appearance-reduced.png

      Write `deliverable.md` in the worktree root with: files
      created/modified, screenshot paths, commit hashes, test counts,
      branch URL.

      Push BEFORE you run out of time.
